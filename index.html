<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>めざせ！爆発缶チャンピオン</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffbf7;
      --card: rgba(255, 255, 255, 0.97);
      --text: #6f4e37;
      --accent-pink: #ffb4ad;
      --accent-pink-dark: #ff8f8f;
      --accent-orange: #ffd3a6;
      --accent-blue: #e7f8ff;
      --accent-blue-dark: #4b728a;
      --line-color: #ffe2bf;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at 10% 15%, rgba(255, 180, 173, 0.4) 0 12%, transparent 12.5%),
        radial-gradient(circle at 90% 10%, rgba(231, 248, 255, 0.6) 0 15%, transparent 15.5%),
        radial-gradient(circle at 15% 85%, rgba(255, 240, 184, 0.5) 0 13%, transparent 13.5%),
        radial-gradient(circle at 85% 85%, rgba(213, 240, 223, 0.5) 0 13%, transparent 13.5%),
        linear-gradient(180deg, #fffefe 0%, #fff9f2 100%);
      color: var(--text);
      font-family: 'Kiwi Maru', 'Yusei Magic', sans-serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    * { box-sizing: border-box; }
    
    .fluffy-card {
      background: var(--card);
      border: 4px solid #ffe2bf;
      border-radius: 2.2rem;
      box-shadow: 0 12px 0 #ffe2bf;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    
    .soft-button {
      border-radius: 999px;
      border: 3px solid transparent;
      box-shadow: 0 8px 0 rgba(111, 78, 55, 0.15);
      transition: transform 0.05s ease, box-shadow 0.05s ease, opacity 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .soft-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 rgba(111, 78, 55, 0.15);
    }
    .soft-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 8px 0 rgba(111, 78, 55, 0.15) !important;
    }
    
    .btn-cute {
      background: linear-gradient(180deg, #fff0db 0%, #ffdaa8 100%);
      border-color: #ffc299;
      color: var(--text);
    }
    .btn-pink {
      background: linear-gradient(180deg, #ffc4be 0%, #ff9993 100%);
      border-color: #ff7d7d;
      color: white;
      text-shadow: 0 2px 0 rgba(0,0,0,0.1);
    }
    .btn-sky {
      background: linear-gradient(180deg, #f0faff 0%, #d2eeff 100%);
      border-color: #b3def5;
      color: var(--accent-blue-dark);
    }
    .btn-gray {
      background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
      border-color: #d1d1d1;
      color: #999;
    }

    .ghost-pill {
      background: rgba(255,255,255,0.85);
      border: 2.5px solid #ffe2bf;
      border-radius: 999px;
      box-shadow: 0 4px 0 #ffe2bf;
    }
    
    .guide-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 32px;
      cursor: ns-resize;
      z-index: 20;
      border-radius: 999px;
      touch-action: none;
      display: flex;
      align-items: center;
    }
    .guide-line::before {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.95;
      box-shadow: 0 0 0 5px rgba(255,255,255,0.85);
    }
    .line-label {
      position: absolute;
      right: 24px;
      transform: translateY(-135%);
      font-size: 15px;
      font-weight: bold;
      background: rgba(255,255,255,0.98);
      padding: 5px 16px;
      border-radius: 999px;
      border: 3px solid currentColor;
      white-space: nowrap;
      box-shadow: 0 6px 12px rgba(0,0,0,0.06);
      font-family: 'Yusei Magic', sans-serif;
    }
    
    .tap-marker {
      position: absolute;
      width: 36px;
      height: 36px;
      background: #ff9993;
      border: 4px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 30;
      box-shadow: 0 4px 18px rgba(255, 125, 125, 0.4);
    }
    .tap-marker::after {
      content: "";
      position: absolute;
      inset: -12px;
      border: 4px solid rgba(255,153,147,0.35);
      border-radius: 50%;
      animation: pulse 1.5s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .recording-dot {
      width: 16px;
      height: 16px;
      background: #ff5b5b;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite;
      box-shadow: 0 0 0 5px rgba(255, 91, 91, 0.2);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    
    input[type="range"] {
      accent-color: #ffb4ad;
      touch-action: pan-x;
    }
    
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ffe2bf; border-radius: 999px; }

    .cute-title-shadow {
      text-shadow: 0 5px 0 #ffcaaf;
      font-family: 'Yusei Magic', sans-serif;
    }
    
    @keyframes crown-glow {
      0%, 100% { transform: scale(1) rotate(-6deg); }
      50% { transform: scale(1.12) rotate(6deg); }
    }
    .gold-medal { animation: crown-glow 2s infinite ease-in-out; }
  </style>
</head>
<body>
  <div class="app-shell relative overflow-hidden flex flex-col p-4 md:p-6 h-[100dvh]">
    <div class="absolute rounded-full w-40 h-40 bg-[#ffd1dc] top-10 left-6 opacity-30 pointer-events-none"></div>
    <div class="absolute rounded-full w-32 h-32 bg-[#d9f3ff] top-24 right-8 opacity-30 pointer-events-none"></div>
    <div class="absolute rounded-full w-28 h-28 bg-[#fff0b8] bottom-24 left-10 opacity-30 pointer-events-none"></div>
    <div class="absolute rounded-full w-44 h-44 bg-[#d5f0df] bottom-10 right-10 opacity-30 pointer-events-none"></div>

    <header class="text-center mb-3 shrink-0 flex flex-col items-center z-10">
      <div class="inline-flex items-center gap-2 ghost-pill px-6 py-1.5 mb-1 text-[#8b6a57] font-bold">
        <span>🫧</span>
        <span class="text-sm tracking-wider">ちいかが　けみすとりーけんてい</span>
        <span>🫧</span>
      </div>
      <h1 class="text-4xl md:text-5xl font-bold text-[#ff8f8f] cute-title-shadow tracking-wide">めざせ！爆発缶チャンピオン</h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-5 flex-1 min-h-0 z-10">
      
      <section class="lg:col-span-7 flex flex-col gap-4 min-h-0">
        <div id="displayArea" class="relative fluffy-card overflow-hidden flex-1 bg-[#fffdfa] flex items-center justify-center cursor-crosshair">
          <video id="mainVideo" class="w-full h-full object-contain bg-black hidden pointer-events-none"></video>
          <video id="cameraPreview" class="w-full h-full object-cover bg-[#eee] object-center pointer-events-none" autoplay playsinline muted></video>

          <div id="calibrationGroup" class="hidden absolute inset-0 pointer-events-none">
            <div id="line1m" class="guide-line text-sky-400 pointer-events-auto" style="top: 30%;">
              <span class="line-label text-sky-400">キムワイプのたかさ</span>
            </div>
            <div id="line0m" class="guide-line text-amber-400 pointer-events-auto" style="top: 80%;">
              <span class="line-label text-amber-400">じめん (0m)</span>
            </div>
          </div>

          <div id="markerLayer" class="absolute inset-0 pointer-events-none"></div>

          <div id="recordingUI" class="absolute top-4 left-4 hidden items-center gap-2 bg-white/95 px-5 py-2.5 rounded-full border-3 border-[#ff9f9a] shadow-lg">
            <span class="recording-dot"></span>
            <span class="text-[#ff6f6f] font-bold text-base">動画を録画してるよ...🎥</span>
          </div>
        </div>

        <div class="fluffy-card p-4 space-y-4 shrink-0">
          <div class="flex gap-4 justify-center">
            <button id="modeCam" class="soft-button btn-cute px-8 py-3 text-lg font-bold flex items-center gap-2">
              <span>📷</span>カメラ画面
            </button>
            <button id="modeVideo" class="soft-button btn-gray px-8 py-3 text-lg font-bold flex items-center gap-2">
              <span>📐</span>たかさ計測モード
            </button>
          </div>

          <div id="camControls" class="flex flex-wrap justify-center gap-4">
            <button id="startRecordBtn" class="soft-button btn-pink text-white px-10 py-4 text-xl font-bold flex items-center gap-2">
              <span class="text-2xl">●</span> ろくが スタート！
            </button>
            <button id="stopRecordBtn" class="soft-button bg-slate-500 border-slate-600 text-white px-10 py-4 text-xl font-bold hidden flex items-center gap-2">
              <span>⏹</span> ろくがを止める
            </button>
            <label class="soft-button btn-sky px-6 py-4 text-lg font-bold cursor-pointer flex items-center gap-2">
              <span>📁</span> ビデオをえらぶ
              <input type="file" id="videoInput" accept="video/*" class="hidden">
            </label>
          </div>

          <div id="measureControls" class="hidden space-y-3">
            <div class="flex items-center gap-4 bg-amber-50/60 p-2 rounded-2xl border border-amber-100">
              <button id="playPauseBtn" class="soft-button btn-cute w-14 h-14 flex items-center justify-center font-black text-2xl shrink-0">
                <span id="playIcon">▶</span>
              </button>
              <input type="range" id="videoSeek" min="0" max="1000" value="0" class="flex-1 h-5 bg-amber-100 rounded-lg appearance-none cursor-pointer border border-amber-200">
            </div>
            <div class="flex justify-between items-center gap-3">
              <div class="flex gap-3">
                <button id="stepBack" class="soft-button bg-white border-3 border-[#ffe2bf] px-5 py-3 text-base font-bold text-[#6f4e37]">◀ こま戻し</button>
                <button id="stepForward" class="soft-button bg-white border-3 border-[#ffe2bf] px-5 py-3 text-base font-bold text-[#6f4e37]">こま送り ▶</button>
              </div>
              <span id="timeDisplay" class="text-base font-bold text-[#b39a8b] bg-white px-5 py-2.5 rounded-full border-2 border-[#ffe2bf]">00:00 / 00:00</span>
            </div>
          </div>
        </div>
      </section>

      <aside class="lg:col-span-5 flex flex-col gap-4 min-h-0">
        <div class="fluffy-card p-4 space-y-3 shrink-0">
          <h3 class="text-xl font-bold text-[#ff8f8f] flex items-center gap-2 font-['Yusei_Magic']">
            <span>✨</span> チャレンジャーのおなまえ
          </h3>
          <input type="text" id="userName" placeholder="なまえを入力してね！"
            class="w-full bg-white border-3 border-[#ffe2bf] rounded-2xl px-5 py-3.5 text-lg font-medium focus:outline-none focus:border-[#ffbfa3] placeholder:text-slate-300">

          <div class="grid grid-cols-10 gap-3 items-center p-4 bg-[#fffefb] rounded-2xl border-3 border-[#ffe2bf]">
            <div class="col-span-4 text-center border-r-3 border-[#ffe2bf]">
              <div class="text-sm text-amber-800/70 font-bold mb-1">とんだ高さ</div>
              <div class="text-4xl font-black text-[#6f4e37] font-['Yusei_Magic']"><span id="currentJumpHeight">0.00</span><span class="text-lg ml-0.5 font-bold">cm</span></div>
            </div>
            <div class="col-span-6 pl-2">
              <button id="saveBtn" class="soft-button btn-cute w-full font-bold py-4 text-lg" disabled>ランキングに のる！🏆</button>
            </div>
          </div>
        </div>

        <div class="fluffy-card p-4 flex flex-col min-h-0 flex-1">
          <div class="flex justify-between items-center mb-3 shrink-0">
            <h3 class="text-xl font-bold text-[#ff8f8f] flex items-center gap-2 font-['Yusei_Magic']">🏆 ランキング</h3>
            <div class="flex items-center gap-1">
              <button id="syncBtn" class="text-sm bg-[#e7f8ff] border-2 border-[#b3def5] text-[#4b728a] font-bold px-3 py-1.5 rounded-full hover:bg-[#d2eeff] transition-all flex items-center gap-1">🔄 同期</button>
              <button id="expandBtn" class="text-sm bg-[#ffb4ad]/20 border-2 border-[#ff9993] text-[#ff6f6f] font-bold px-3 py-1.5 rounded-full hover:bg-[#ffb4ad]/40 transition-all flex items-center gap-1">🔍 おっきくする</button>
              <button id="clearBtn" class="text-xs text-slate-300 hover:text-red-400 font-bold ml-1">消去</button>
            </div>
          </div>
          
          <div id="rankingList" class="flex-1 min-h-0 space-y-3 overflow-y-auto pr-1">
            <div class="text-center py-12 text-slate-300 text-base font-bold">まだデータがないよ。さいしょのチャンピオンになろう！</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="fullscreenRankingModal" class="fixed inset-0 bg-[#fffbf7] z-50 p-6 md:p-12 hidden flex-col overflow-hidden">
    <div class="absolute rounded-full w-80 h-80 bg-[#ffd1dc]/40 -top-10 -left-10 pointer-events-none"></div>
    <div class="absolute rounded-full w-96 h-96 bg-[#d9f3ff]/40 -bottom-20 -right-20 pointer-events-none"></div>
    <div class="absolute rounded-full w-64 h-64 bg-[#fff0b8]/30 top-1/3 right-10 pointer-events-none"></div>
    
    <div class="max-w-4xl w-full mx-auto flex flex-col h-full relative z-10">
      <div class="flex justify-between items-center mb-8 shrink-0">
        <h2 class="text-4xl md:text-5xl font-bold text-[#ff8f8f] cute-title-shadow tracking-wider flex items-center gap-3">
          👑 爆発缶ランキング
        </h2>
        <button id="closeExpandBtn" class="soft-button btn-pink text-white px-8 py-3 text-xl font-bold">
          ❌ とじる
        </button>
      </div>
      
      <div id="fullscreenRankingList" class="flex-1 overflow-y-auto space-y-4 pr-2 pb-6 text-2xl">
        </div>
    </div>
  </div>

  <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 bg-[#8fd8ff] text-white px-8 py-4 rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 text-xl font-bold border-4 border-white">すごーい！保存したよ！</div>

  <script>
    const GAS_CONFIG = {
      ENABLE_UPLOAD: true,
      WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbxeXRjo3oXn9f881i1eIIYgyNhv0GygmB_mSF-8vCXnLTSQI29rS5UuEktvKdQy5WcWGw/exec',
      SECRET: 'chiikawa-jump-2026'
    };

    const STORAGE_KEY = 'chiikawa_jump_rankings_v4';

    const state = {
      mode: 'camera',
      videoLoaded: false,
      isRecording: false,
      currentY: 0,
      results: [],
      fps: 30,
      mediaRecorder: null,
      chunks: [],
      audioCtx: null
    };

    const video = document.getElementById('mainVideo');
    const preview = document.getElementById('cameraPreview');
    const videoInput = document.getElementById('videoInput');
    const line0m = document.getElementById('line0m');
    const line1m = document.getElementById('line1m');
    const markerLayer = document.getElementById('markerLayer');
    const currentHeightEl = document.getElementById('currentJumpHeight');
    const saveBtn = document.getElementById('saveBtn');
    const rankingList = document.getElementById('rankingList');
    const fullscreenRankingList = document.getElementById('fullscreenRankingList');
    const recordBtn = document.getElementById('startRecordBtn');
    const stopBtn = document.getElementById('stopRecordBtn');
    const recordingUI = document.getElementById('recordingUI');
    const camControls = document.getElementById('camControls');
    const measureControls = document.getElementById('measureControls');
    const calibGroup = document.getElementById('calibrationGroup');
    const modeCam = document.getElementById('modeCam');
    const modeVideo = document.getElementById('modeVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const videoSeek = document.getElementById('videoSeek');
    const timeDisplay = document.getElementById('timeDisplay');
    const toast = document.getElementById('toast');
    const syncBtn = document.getElementById('syncBtn');
    const expandBtn = document.getElementById('expandBtn');
    const closeExpandBtn = document.getElementById('closeExpandBtn');
    const fullscreenModal = document.getElementById('fullscreenRankingModal');

    function loadLocalResults() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.results = raw ? JSON.parse(raw) : [];
      } catch {
        state.results = [];
      }
    }

    function saveLocalResults() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.results));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.style.opacity = '1';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        toast.style.opacity = '0';
      }, 1800);
    }

    async function ensureAudio() {
      if (!state.audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        state.audioCtx = new AudioCtx();
      }
      if (state.audioCtx.state === 'suspended') {
        try { await state.audioCtx.resume(); } catch {}
      }
      return state.audioCtx;
    }

    async function playSfx(type) {
      const ctx = await ensureAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      const now = ctx.currentTime;
      const presets = {
        tap:   { t: 'triangle', f: [560, 760], d: 0.09, g: 0.06 },
        save:  { t: 'sine',     f: [660, 880, 1320], d: 0.18, g: 0.08 },
        start: { t: 'square',   f: [400, 550], d: 0.12, g: 0.05 },
        stop:  { t: 'sawtooth', f: [550, 400], d: 0.12, g: 0.05 },
        mode:  { t: 'triangle', f: [440, 660], d: 0.10, g: 0.05 },
        error: { t: 'sine',     f: [220, 160], d: 0.15, g: 0.06 }
      };
      const p = presets[type] || presets.tap;

      osc.type = p.t;
      osc.frequency.setValueAtTime(p.f[0], now);
      if (p.f.length > 1) {
        p.f.forEach((f, i) => osc.frequency.exponentialRampToValueAtTime(f, now + (p.d * (i + 1) / p.f.length)));
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(p.g, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + p.d);

      osc.start(now);
      osc.stop(now + p.d + 0.02);
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        preview.srcObject = stream;
      } catch (err) {
        console.error('Camera error:', err);
        alert('カメラの準備ができなかったみたい...設定をチェックしてみてね。');
      }
    }

    function setMode(mode) {
      state.mode = mode;

      if (mode === 'camera') {
        preview.classList.remove('hidden');
        video.classList.add('hidden');
        camControls.classList.remove('hidden');
        measureControls.classList.add('hidden');
        calibGroup.classList.add('hidden');

        modeCam.className = 'soft-button btn-cute px-8 py-3 text-lg font-bold flex items-center gap-2';
        modeVideo.className = 'soft-button btn-gray px-8 py-3 text-lg font-bold flex items-center gap-2';
      } else {
        preview.classList.add('hidden');
        video.classList.remove('hidden');
        camControls.classList.add('hidden');
        measureControls.classList.remove('hidden');
        calibGroup.classList.remove('hidden');

        modeVideo.className = 'soft-button btn-cute px-8 py-3 text-lg font-bold flex items-center gap-2';
        modeCam.className = 'soft-button btn-gray px-8 py-3 text-lg font-bold flex items-center gap-2';
      }
    }

    function pickRecorderMimeType() {
      const candidates = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
      ];
      return candidates.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    }

    function loadVideo(url) {
      video.src = url;
      state.videoLoaded = true;
      setMode('measure');
      saveBtn.disabled = false;
      playIcon.textContent = '▶';
      currentHeightEl.textContent = '0.00';
      markerLayer.innerHTML = '';
      state.currentY = 0;
      video.onloadeddata = () => {
        video.currentTime = 0;
      };
    }

    function calculateHeight() {
  const y0 = line0m.offsetTop + 16;
  const y1 = line1m.offsetTop + 16;
  const peak = state.currentY;

  if (y0 === y1 || peak === 0) return 0;

  // キムワイプ高さ 9.2cm
  const pxPerRef = Math.abs(y0 - y1);

  const heightCm = ((y0 - peak) / pxPerRef) * 9.2;
  const val = Math.max(0, heightCm).toFixed(1);

  currentHeightEl.textContent = val;
  return parseFloat(val);
}

    function renderRanking() {
      if (state.results.length === 0) {
        rankingList.innerHTML = '<div class="text-center py-12 text-slate-300 text-base font-bold">まだデータがないよ。さいしょのチャンピオンになろう！</div>';
        return;
      }

      rankingList.innerHTML = state.results.map((r, i) => {
        let medalClass = 'bg-amber-100 text-[#6f4e37] text-base font-bold';
        let medalLabel = i + 1;
        let cardBorder = 'border-[#ffe2bf]';
        let cardBg = 'bg-white';

        if (i === 0) {
          medalClass = 'bg-gradient-to-br from-yellow-300 to-amber-500 text-white font-black text-xl gold-medal shadow-md';
          medalLabel = '👑';
          cardBorder = 'border-amber-400 border-3';
          cardBg = 'bg-amber-50/40';
        } else if (i === 1) {
          medalClass = 'bg-gradient-to-br from-slate-200 to-slate-400 text-white font-black text-lg';
          medalLabel = '🥈';
          cardBorder = 'border-slate-300';
        } else if (i === 2) {
          medalClass = 'bg-gradient-to-br from-amber-600 to-amber-800 text-white font-black text-lg';
          medalLabel = '🥉';
          cardBorder = 'border-amber-700/30';
        }

        const dateStr = r.time ? new Date(r.time).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

        return `
          <div class="flex items-center gap-4 ${cardBg} p-4 rounded-2xl border-2 ${cardBorder} shadow-sm">
            <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-full ${medalClass}">
              ${medalLabel}
            </div>
            <div class="flex-grow min-w-0">
              <div class="font-bold text-[#6f4e37] text-lg truncate">${String(r.name ?? 'ななしさん')}</div>
              <div class="text-xs text-slate-400 font-bold">${dateStr}</div>
            </div>
            <div class="text-3xl font-black text-[#ff8f8f] italic whitespace-nowrap tracking-wide font-['Yusei_Magic']">
              ${Number(r.height || 0).toFixed(2)}<span class="text-sm ml-0.5 not-italic font-bold text-[#6f4e37]">m</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderFullscreenRanking() {
      if (state.results.length === 0) {
        fullscreenRankingList.innerHTML = '<div class="text-center py-24 text-slate-300 font-bold">まだデータがないよ。</div>';
        return;
      }

      fullscreenRankingList.innerHTML = state.results.map((r, i) => {
        let medalClass = 'w-16 h-16 text-2xl bg-amber-100 text-[#6f4e37] font-bold';
        let medalLabel = i + 1;
        let cardStyle = 'border-[#ffe2bf] bg-white';

        if (i === 0) {
          medalClass = 'w-20 h-20 text-4xl bg-gradient-to-br from-yellow-300 to-amber-500 text-white gold-medal shadow-lg';
          medalLabel = '👑';
          cardStyle = 'border-amber-400 border-4 bg-amber-50/60 shadow-md transform scale-[1.01]';
        } else if (i === 1) {
          medalClass = 'w-16 h-16 text-2xl bg-gradient-to-br from-slate-200 to-slate-400 text-white';
          medalLabel = '🥈';
          cardStyle = 'border-slate-300 bg-white shadow-sm';
        } else if (i === 2) {
          medalClass = 'w-16 h-16 text-2xl bg-gradient-to-br from-amber-600 to-amber-800 text-white';
          medalLabel = '🥉';
          cardStyle = 'border-amber-600/40 bg-white shadow-sm';
        }

        return `
          <div class="flex items-center gap-6 ${cardStyle} p-6 rounded-3xl border-3 transition-all">
            <div class="shrink-0 flex items-center justify-center rounded-full ${medalClass}">
              ${medalLabel}
            </div>
            <div class="flex-grow min-w-0">
              <div class="font-bold text-[#6f4e37] text-3xl truncate">${String(r.name ?? 'ななしさん')}</div>
            </div>
            <div class="text-6xl font-black text-[#ff8f8f] italic whitespace-nowrap tracking-wide font-['Yusei_Magic']">
              ${Number(r.height || 0).toFixed(2)}<span class="text-2xl ml-1 not-italic font-bold text-[#6f4e37]">m</span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function sendToGAS(record) {
      if (!GAS_CONFIG.ENABLE_UPLOAD || !GAS_CONFIG.WEB_APP_URL) return;
      try {
        await fetch(GAS_CONFIG.WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            secret: GAS_CONFIG.SECRET,
            action: 'save',
            app: 'chiikawa-jump-rank',
            record
          })
        });
      } catch (err) {
        console.warn('GAS send failed:', err);
      }
    }

    async function fetchFromGAS(showSuccessToast = false) {
      if (!GAS_CONFIG.ENABLE_UPLOAD || !GAS_CONFIG.WEB_APP_URL) return;
      try {
        const url = `${GAS_CONFIG.WEB_APP_URL}?action=list&secret=${encodeURIComponent(GAS_CONFIG.SECRET)}&app=chiikawa-jump-rank`;
        const res = await fetch(url, { method: 'GET', cache: 'no-cache' });
        const data = await res.json();
        if (Array.isArray(data)) {
          state.results = data.sort((a, b) => b.height - a.height);
          saveLocalResults();
          renderRanking();
          renderFullscreenRanking();
          if (showSuccessToast) showToast('最新データを読みこんだよ！✨');
        }
      } catch (err) {
        console.warn('GAS fetch failed:', err);
      }
    }

    function setupDraggableLine(el) {
      let dragging = false;
      let pointerId = null;

      const moveAt = (clientY) => {
        const rect = document.getElementById('displayArea').getBoundingClientRect();
        let y = clientY - rect.top;
        y = Math.max(0, Math.min(y, rect.height));
        el.style.top = `${y - 16}px`;
        calculateHeight();
      };

      el.addEventListener('pointerdown', (e) => {
        dragging = true;
        pointerId = e.pointerId;
        el.setPointerCapture(pointerId);
        playSfx('tap');
        e.preventDefault();
        e.stopPropagation();
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging || e.pointerId !== pointerId) return;
        moveAt(e.clientY);
        e.preventDefault();
        e.stopPropagation();
      });

      const endDrag = (e) => {
        if (e.pointerId !== pointerId) return;
        dragging = false;
        try { el.releasePointerCapture(pointerId); } catch {}
        pointerId = null;
        e.stopPropagation();
      };

      el.addEventListener('pointerup', endDrag);
      el.addEventListener('pointercancel', endDrag);
    }

    recordBtn.onclick = async () => {
      await playSfx('start');
      state.chunks = [];
      const stream = preview.srcObject;
      if (!stream) {
        await playSfx('error');
        alert('カメラのストリームが見つからないよ。');
        return;
      }

      const mimeType = pickRecorderMimeType();
      try {
        state.mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      } catch (err) {
        console.error(err);
        await playSfx('error');
        alert('このブラウザは録画に対応していないみたい。');
        return;
      }

      state.mediaRecorder.ondataavailable = e => state.chunks.push(e.data);
      state.mediaRecorder.onstop = () => {
        const blobType = state.chunks[0]?.type || state.mediaRecorder?.mimeType || 'video/webm';
        const blob = new Blob(state.chunks, { type: blobType });
        loadVideo(URL.createObjectURL(blob));
      };
      state.mediaRecorder.start();
      state.isRecording = true;
      recordBtn.classList.add('hidden');
      stopBtn.classList.remove('hidden');
      recordingUI.classList.remove('hidden');
      recordingUI.classList.add('flex');
    };

    stopBtn.onclick = async () => {
      await playSfx('stop');
      state.mediaRecorder?.stop();
      state.isRecording = false;
      recordBtn.classList.remove('hidden');
      stopBtn.classList.add('hidden');
      recordingUI.classList.add('hidden');
      recordingUI.classList.remove('flex');
    };

    videoInput.onchange = async (e) => {
      if (e.target.files[0]) {
        await playSfx('tap');
        loadVideo(URL.createObjectURL(e.target.files[0]));
      }
    };

    modeCam.onclick = async () => { await playSfx('mode'); setMode('camera'); };
    modeVideo.onclick = async () => { await playSfx('mode'); if (state.videoLoaded) setMode('measure'); };

    playPauseBtn.onclick = async () => {
      await playSfx('tap');
      if (video.paused) {
        await video.play();
        playIcon.textContent = '||';
      } else {
        video.pause();
        playIcon.textContent = '▶';
      }
    };

    video.ontimeupdate = () => {
      if (!video.duration || !isFinite(video.duration)) return;
      videoSeek.value = (video.currentTime / video.duration) * 1000;
      const cur = Math.floor(video.currentTime);
      const dur = Math.floor(video.duration || 0);
      timeDisplay.textContent = `${String(Math.floor(cur / 60)).padStart(2, '0')}:${String(cur % 60).padStart(2, '0')} / ${String(Math.floor(dur / 60)).padStart(2, '0')}:${String(dur % 60).padStart(2, '0')}`;
    };

    videoSeek.oninput = async () => {
      await ensureAudio();
      if (video.duration) video.currentTime = (videoSeek.value / 1000) * video.duration;
    };

    document.getElementById('stepForward').onclick = async () => {
      await playSfx('tap');
      video.currentTime += (1 / state.fps);
    };
    document.getElementById('stepBack').onclick = async () => {
      await playSfx('tap');
      video.currentTime -= (1 / state.fps);
    };

    document.getElementById('displayArea').onclick = async (e) => {
      if (state.mode !== 'measure') return;
      if (e.target.closest('.guide-line')) return;

      await playSfx('tap');
      const rect = document.getElementById('displayArea').getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      state.currentY = y;
      markerLayer.innerHTML = `<div class="tap-marker" style="top:${y}px; left:${x}px"></div>`;
      calculateHeight();
    };

    saveBtn.onclick = async () => {
      const h = calculateHeight();
      if (h <= 0 || state.currentY === 0) {
        await playSfx('error');
        alert('ジャンプの最高到達点を画面タップでマークしてね！');
        return;
      }

      await playSfx('save');

      const record = {
        name: document.getElementById('userName').value.trim() || 'ななしさん',
        height: h,
        time: Date.now()
      };

      state.results.push(record);
      state.results.sort((a, b) => b.height - a.height);
      saveLocalResults();
      renderRanking();
      renderFullscreenRanking();
      
      document.getElementById('userName').value = '';
      showToast('すごーい！ランキングに保存したよ！✨');

      await sendToGAS(record);
    };

    syncBtn.onclick = async () => {
      await playSfx('mode');
      await fetchFromGAS(true);
    };

    expandBtn.onclick = async () => {
      await playSfx('mode');
      renderFullscreenRanking();
      fullscreenModal.classList.remove('hidden');
      fullscreenModal.classList.add('flex');
    };

    closeExpandBtn.onclick = async () => {
      await playSfx('tap');
      fullscreenModal.classList.add('hidden');
      fullscreenModal.classList.remove('flex');
    };

    document.getElementById('clearBtn').onclick = async () => {
      await playSfx('tap');
      if (confirm('本日の方々のランキングデータをすべて消去しますか？（ローカルのみ）')) {
        state.results = [];
        saveLocalResults();
        renderRanking();
        renderFullscreenRanking();
      }
    };

    (async () => {
      loadLocalResults();
      renderRanking();
      setupDraggableLine(line0m);
      setupDraggableLine(line1m);
      await fetchFromGAS();
      initCamera();
      setMode('camera');
    })();
  </script>
</body>
</html>
